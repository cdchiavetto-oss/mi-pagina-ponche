<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redes Sociales - Cristian Chiavetto</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #e8e4df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 60px 40px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #6b3a2a;
    }

    p {
      font-size: 1rem;
      color: #6b3a2a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .redes {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 360px;
    }

    .red-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      font-family: 'Raleway', sans-serif;
      letter-spacing: 0.03em;
      transition: transform 0.2s, opacity 0.2s;
      color: white;
    }

    .red-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .red-btn svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .facebook  { background-color: #1877f2; }

    .volver {
      font-family: 'Raleway', sans-serif;
      font-size: 0.9rem;
      color: #6b3a2a;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .volver:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cristian Chiavetto</h1>
    <p>Seguime en mis redes</p>

    <div class="redes">
      <a href="https://www.instagram.com/_cristianchiavetto" target="_blank" class="red-btn instagram">

          <path d="M12 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/>

        Instagram
      </a>

      <a href="https://www.facebook.com/cchiavetto/" target="_blank" class="red-btn facebook">
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
        </svg>
        Facebook
      </a>
    </div>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>
</body>
</html>
