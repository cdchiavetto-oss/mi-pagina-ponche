<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Página</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #0d3fa6;
      --red-dark: #082a7a;
      --red-light: #2563eb;
      --white: #ffffff;
      --black: #0a0a0a;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--red);
      background-image:
        radial-gradient(ellipse at 20% 50%, var(--red-light) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, var(--red-dark) 0%, transparent 50%);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 3rem 2rem;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(3.5rem, 12vw, 8rem);
      color: var(--white);
      line-height: 1;
      letter-spacing: -0.02em;
      text-shadow:
        0 2px 40px rgba(0, 0, 0, 0.25),
        0 0 80px rgba(255, 255, 255, 0.08);
      animation: fadeUp 0.9s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      animation: fadeUp 0.9s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .btn {
      background-color: var(--black);
      color: var(--white);
      border: none;
      padding: 1rem 2.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      animation: fadeUp 0.9s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .btn:hover::after {
      transform: translateX(0);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="name">Cristian</h1>
    <div class="divider"></div>
    <button class="btn">Haz clic aquí</button>
  </div>
</body>
</html>
