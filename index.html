<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cristian Chiavetto</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #e8e4df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
      padding: 60px 40px;
      max-width: 1100px;
      width: 100%;
    }

    .photo-wrapper {
      flex-shrink: 0;
    }

    .photo-oval {
      width: 320px;
      height: 420px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #6b3a2a;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }

    .photo-oval img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      color: #6b3a2a;
      line-height: 1.1;
      margin-bottom: 28px;
    }

    .descripcion {
      font-size: 1rem;
      color: #6b3a2a;
      opacity: 0.75;
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .arrow {
      font-size: 1.8rem;
      color: #6b3a2a;
      margin-bottom: 24px;
      display: block;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Raleway', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: #6b3a2a;
      text-decoration: underline;
      text-underline-offset: 4px;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
    }

    .links a svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .links a:hover {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 40px;
        text-align: center;
      }
      .info { align-items: center; }
      .photo-oval { width: 240px; height: 310px; }
      h1 { font-size: 2.8rem; }
    }
  </style>
</head>
